name: Verify models

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterfactory-verification-${{ github.sha }}
          path: |
            build/*.log
            build/verification.json
            build/reproduced.itf.json
